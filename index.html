<script>
(()=>{'use strict';
const CONTENT=JSON.parse(document.querySelector('#bank').textContent);
const Q=CONTENT.questions, CH=CONTENT.chapters, SOURCES=CONTENT.sources, META=CONTENT.meta, QB=Object.fromEntries(Q.map(q=>[q.id,q]));
const HOLD=Q.filter(q=>q.holdout), NORMAL=Q.filter(q=>!q.holdout);
const STORAGE_KEY='foodlabel-beginner-'+META.signature;
let db={records:{},exams:[],seenMock:{},modifiedAt:null};
let screen='home',session=null,result=null,toastTimeout=null,timer=null;
let cfg={ch:'all',difficulty:'auto',limit:'0',newonly:false};
let activeReview='wrong';
const $=(s)=>document.querySelector(s), app=$('#app');
const esc=(t)=>String(t??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function save(){db.modifiedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){notice('保存できません。プライベートブラウズ等の設定をご確認ください。')}}
function load(){try{const v=localStorage.getItem(STORAGE_KEY);if(v){const d=JSON.parse(v);if(d&&typeof d.records==='object'&&Array.isArray(d.exams)&&typeof d.seenMock==='object')db=d}}catch(e){console.warn('履歴を読み込めません:',e)}}
function notice(s){const prev=$('.toast');if(prev)prev.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.remove(),3600)}
function rec(q){return db.records[q.id]||null}
function totalAttempts(){return Object.values(db.records).reduce((s,x)=>s+(x.tries||0),0)}
function rates(items){const answered=items.filter(q=>rec(q));let sum=0,cor=0;answered.forEach(q=>{const r=rec(q);sum+=r.tries||0;cor+=r.right||0});return {done:answered.length,total:items.length,accuracy:sum?Math.round(cor/sum*100):0}}
function wrongs(){return Q.filter(q=>(rec(q)?.wrong||0)>0)}
function needsReview(q){const r=rec(q);return !!(r&&((r.lastWrong)||((r.wrong||0)>0&&(r.right||0)<2)))}
function isDue(q){const r=rec(q);if(!r)return false;const age=Date.now()-(r.lastAt||0);return needsReview(q)&&age>=20*60*1000 || r.right>0&&r.tries<3&&age>2*24*3600*1000}
function mark(q,choice,kind){const r=db.records[q.id]||{tries:0,right:0,wrong:0,firstAt:Date.now(),seenOptions:{}};r.tries++;const correct=choice===q.correct;if(correct){r.right++;r.streak=(r.streak||0)+1}else{r.wrong++;r.streak=0}r.lastWrong=!correct;r.lastAt=Date.now();r.lastChoice=choice;r.history=(r.history||[]).concat([{at:r.lastAt,choice,correct}]).slice(-100);r.seenOptions[String(choice)]=(r.seenOptions[String(choice)]||0)+1;db.records[q.id]=r;if(q.holdout)db.seenMock[q.id]=true;save();return correct}
function topicStatuses(){const groups=new Map();for(const q of Q){const key=q.ch+'|'+q.topic;if(!groups.has(key))groups.set(key,{ch:q.ch,topic:q.topic,items:[]});groups.get(key).items.push(q)}return [...groups.values()].map(g=>{const a=g.items.filter(q=>rec(q)),total=a.reduce((s,q)=>s+(rec(q)?.tries||0),0),correct=a.reduce((s,q)=>s+(rec(q)?.right||0),0),different=a.filter(q=>(rec(q)?.right||0)>0).length,first=a.length?Math.min(...a.map(q=>rec(q)?.firstAt||Date.now())):0,last=a.length?Math.max(...a.map(q=>rec(q)?.lastAt||0)):0;let status='未学習';if(a.length){status='学習中';if(different>=2&&total>=3&&correct/total>=0.7)status='定着確認中';if(different>=2&&total>=3&&correct/total>=0.8&&last-first>=24*3600*1000)status='習得済み'}return {...g,status,answered:a.length,count:g.items.length}})}
function chapterNums(){return CH.map((title,i)=>{const a=Q.filter(q=>q.ch===i),r=rates(a);return {i,title,...r,percent:r.total?Math.round(r.done/r.total*100):0}})}
function focusCount(){return Q.filter(needsReview).length}
function setScreen(x){screen=x;render();window.scrollTo({top:0,behavior:'auto'})}
function navActive(){['Home','Review','Settings'].forEach(n=>$('#nav'+n).classList.toggle('active',(n==='Home'&&screen==='home')||(n==='Review'&&screen==='review')||(n==='Settings'&&screen==='settings')))}
function statCard(label,val,unit,note){return `<div class="card stat"><div class="statLabel">${esc(label)}</div><div class="statValue">${esc(val)}<span class="statSuffix">${esc(unit||'')}</span></div><div class="statNote">${esc(note||'')}</div></div>`}
function home(){const r=rates(Q), cn=chapterNums();const doneStudy=NORMAL.filter(q=>rec(q)).length;return `<section class="hero"><div class="heroContent"><div class="eyebrow">START WITH QUESTIONS</div><h1>解くたびに、<br>食品表示が分かる。</h1><p class="herop">公的資料の関連箇所を示した4択演習。回答直後に解説と出典を確認できます。※公式テキスト全文照合・全問の厳密な検証は未完了です。</p><div class="buttonrow"><button class="btn btnPrimary" data-action="startLearn">問題を解く →</button><button class="btn btnSecondary" data-action="goReview">復習する</button></div><p class="version">${NORMAL.length}問の通常演習 ＋ ${HOLD.length}問の模擬試験用問題 / 回答履歴は端末内に保存</p></div><div class="heroIllustration" aria-hidden="true"><div class="illustration"><div class="illusHead"></div><div class="illusBar"></div><div class="illusBar"></div><div class="illusBar" style="width:65%"></div><div class="illusCheck">✓</div></div></div></section>
<section class="stats" aria-label="学習の状況">${statCard('収録問題数',Q.length,'問','全6章・4択')}${statCard('回答済み問題',r.done,'問',`学習用 ${doneStudy} / ${NORMAL.length}`)}${statCard('これまでの正答率',r.accuracy,'%','再回答も含む')}${statCard('復習したい問題',focusCount(),'問','直近で誤答など')}</section>
<div class="sectionHeader"><h2>分野別の学習状況</h2><p class="small muted">回答した問題の割合</p></div><div class="chapterList">${cn.map(c=>`<div class="card chapter"><div class="chapterTitle"><div><span class="chapterNum">第${c.i+1}章</span><div>${esc(c.title)}</div></div><span class="pill">${c.percent}%</span></div><div class="meta"><span>回答済み ${c.done}/${c.total}問</span><span>正答率 ${c.done?c.accuracy+'%':'—'}</span></div><div class="bar"><span style="width:${c.percent}%"></span></div><details class="accord"><summary>小項目ごとの習得状況</summary><div style="padding-top:8px">${topicStatuses().filter(t=>t.ch===c.i).map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:11px;padding:5px 0;border-bottom:1px solid #edf1f7"><span>${esc(t.topic)} <span class="muted">${t.answered}/${t.count}問</span></span><span style="white-space:nowrap" class="pill ${t.status==='習得済み'?'':'warnPill'}">${t.status}</span></div>`).join('')}</div></details></div>`).join('')}</div>
<div class="split"><div class="card infoCard"><span class="pill">本番形式の練習</span><h3 style="margin-top:12px">模擬試験（75問・90分）</h3><p>本番と同じ問題数・時間で一括採点します。未回答のまま練習問題を解かずに挑戦できるよう、模試用の問題を通常演習から分離しています。</p><button class="btn btnPrimary btnSm" data-action="goExam">模擬試験に挑戦 →</button></div><div class="card infoCard"><span class="pill">自分に合わせて</span><h3 style="margin-top:12px">出題をカスタマイズ</h3><p>分野、難易度、出題数、未回答のみを指定できます。基本は自動出題なので、設定なしでもすぐに学べます。</p><button class="btn btnSecondary btnSm" data-action="goSettings">演習の設定</button></div></div><p class="small muted" style="margin-top:17px">※模試の分野配分は公開されていない公式比率ではなく、当サイト独自の目安です。細かな法令事項は公式情報も確認してください。</p>`}
function review(){const all=Q.filter(q=>rec(q)),w=wrongs(),f=Q.filter(needsReview),due=Q.filter(isDue);const recent=Q.flatMap(q=>(rec(q)?.history||[]).map(h=>({...h,q}))).sort((a,b)=>b.at-a.at).slice(0,25);return `<div class="pageTitle"><div class="eyebrow">REVIEW</div><h1>復習する</h1><p class="muted small">間違えた問題を自動保存。何度でも解き直せます。</p></div><div class="reviewGrid"><div class="card reviewCard"><h3>間違えた問題</h3><p>これまで一度でも間違えた問題をすべて復習します。</p><div class="big">${w.length}<span class="small muted"> 問</span></div><button data-action="startReview" data-review="wrong" class="btn btnPrimary">この問題を解く</button></div><div class="card reviewCard"><h3>解いたすべての問題</h3><p>過去に回答した問題を、正誤にかかわらず復習します。</p><div class="big">${all.length}<span class="small muted"> 問</span></div><button data-action="startReview" data-review="all" class="btn btnSecondary">この問題を解く</button></div><div class="card reviewCard"><h3>まだ苦手な問題</h3><p>直近で間違えた問題や、正解の定着を確認したい問題。</p><div class="big">${f.length}<span class="small muted"> 問</span></div><button data-action="startReview" data-review="focus" class="btn btnSecondary">この問題を解く</button></div></div><div class="card infoCard" style="margin-top:17px"><h3>今日の復習候補</h3><p>時間を空けてもう一度解くと、答えを覚えるだけでなく知識の定着を確認できます。</p><div class="buttonrow"><button class="btn btnSecondary btnSm" data-action="startReview" data-review="due">復習タイミングの問題（${due.length}問）</button><button class="btn btnGhost btnSm" data-action="goHome">ホームへ戻る</button></div></div><div class="card infoCard" style="margin-top:16px"><h3>最近の回答履歴</h3>${recent.length?`<div style="max-height:360px;overflow-y:auto">${recent.map(x=>`<div class="resultRow"><span class="resultNo">${esc(new Date(x.at).toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit'}))}</span><span class="resultText">${esc(x.q.stem)}<div class="small muted">回答：${esc(x.choice==null?'未回答':x.q.opts[x.choice])}</div></span><span class="${x.correct?'right':'wrong'}">${x.correct?'正解':'不正解'}</span></div>`).join('')}</div>`:'<p>まだ回答履歴はありません。</p>'}</div>`}
function settings(){return `<div class="pageTitle"><div class="eyebrow">LEARNING SETTINGS</div><h1>演習の設定</h1><p class="muted small">設定しなくても「問題を解く」から自動出題で学習できます。</p></div><div class="card settingsCard"><div class="fields"><div><label class="fieldLabel" for="selectChapter">分野</label><select class="control" id="selectChapter" data-filter="ch"><option value="all">すべての分野</option>${CH.map((x,i)=>`<option value="${i}" ${cfg.ch===String(i)?'selected':''}>第${i+1}章 ${esc(x)}</option>`).join('')}</select></div><div><label class="fieldLabel" for="selectDifficulty">難易度</label><select class="control" id="selectDifficulty" data-filter="difficulty"><option value="auto">自動（基礎 → 標準 → 応用）</option><option value="1">基礎のみ</option><option value="2">標準のみ</option><option value="3">応用のみ</option></select></div><div><label class="fieldLabel" for="selectLimit">出題数</label><select class="control" id="selectLimit" data-filter="limit"><option value="0">制限なし（終了するまで）</option><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option></select></div><div><div class="fieldLabel">出題対象</div><label class="inlineCheck" style="margin:6px 0"><input type="checkbox" id="newOnly" data-filter="newonly">まだ解いていない問題のみ</label></div></div><div class="buttonrow"><button class="btn btnPrimary" data-action="startLearn">この設定で演習する →</button><button class="btn btnGhost" data-action="resetConfig">おすすめ設定に戻す</button></div><div class="panelNote">学習履歴はこのブラウザのlocalStorageに保存されます。機種変更やブラウザのデータ消去に備え、下のエクスポートを使ってください。</div><h3 style="margin-top:26px">学習データのバックアップ</h3><div class="buttonrow"><button class="btn btnSecondary btnSm" data-action="export">履歴を書き出す（JSON）</button><button class="btn btnGhost btnSm" data-action="import">履歴を読み込む</button><input style="display:none" id="importFile" type="file" accept=".json,application/json"></div><p class="small muted">別バージョンの問題内容で作った履歴は、採点の取り違えを防ぐため読み込めません。</p><p class="small muted">データを消したいときは、下のボタンから初期化できます。この操作は元に戻せません。</p><button class="btn btnDanger btnSm" data-action="clearData">学習履歴をすべて消去</button><p class="version">問題データ版: ${esc(META.signature.slice(0,12))} / 総問題数: ${Q.length} / 制度基準日: ${esc(META.lawDate)}</p></div>`}
function examIntro(){return `<div class="pageTitle"><div class="eyebrow">MOCK EXAM</div><h1>模擬試験</h1><p class="muted small">75問・90分で学習状況を測ります。独自問題のみの模試であり、公式過去問や本番難度の再現ではありません。</p></div><div class="card examIntro"><div class="stats" style="margin:0 0 20px">${statCard('問題数','75','問','択一・4択')}${statCard('制限時間','90','分','途中でも採点可')}${statCard('合格目安','70','%','当サイトの単純正答率')}${statCard('模試用ストック',HOLD.filter(q=>!db.seenMock[q.id]).length,'問','未使用の模試用問題')}</div><h3>模試のルール</h3><p>正誤と解説は試験終了後に表示します。問題ごとの配点は公式のものが公開されていないため、正答率70％以上を学習上の目安とします。</p><p>初めて受験する模試では未出題の問題が中心です。2回目以降は一部の問題が再出題される場合があり、その場合は得点の解釈に注意が必要です。</p><p>問題の分野別配分は独自設計です（公式出題比率ではありません）。</p><div class="buttonrow"><button class="btn btnPrimary" data-action="startExam">模擬試験を開始 →</button><button class="btn btnGhost" data-action="goHome">ホームへ戻る</button></div></div>`}
function orderForLearn(a){const topicOrder=new Map();NORMAL.forEach(q=>{const key=q.ch+':'+q.topic;if(!topicOrder.has(key))topicOrder.set(key,topicOrder.size)});return a.sort((a,b)=>{const x=topicOrder.get(a.ch+':'+a.topic)||0,y=topicOrder.get(b.ch+':'+b.topic)||0;return x-y||a.diff-b.diff||a.id.localeCompare(b.id)})}
function startLearn(){const filtered=NORMAL.filter(q=>(cfg.ch==='all'||q.ch===+cfg.ch)&&(cfg.difficulty==='auto'||q.diff===+cfg.difficulty)&&(!cfg.newonly||!rec(q)));if(!filtered.length){notice('この設定に該当する未学習問題はありません。設定を変更してください。');setScreen('settings');return}const pool=orderForLearn(filtered);session={type:'learn',pool:pool.map(q=>q.id),at:0,limit:+cfg.limit||0,answers:{},since:Date.now(),cycles:0};setScreen('quiz')}
function startReview(mode){activeReview=mode;let arr=mode==='wrong'?wrongs():mode==='all'?Q.filter(q=>rec(q)):mode==='focus'?Q.filter(needsReview):Q.filter(isDue);if(!arr.length){notice('対象の問題はまだありません。まず演習を始めましょう。');return}arr=arr.sort((a,b)=>(rec(a)?.lastAt||0)-(rec(b)?.lastAt||0));session={type:'review',pool:arr.map(q=>q.id),at:0,limit:0,answers:{},since:Date.now(),cycles:0};setScreen('quiz')}
function fnv(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function startExam(){const portions=[5,10,31,11,11,7], selected=[];let unseen=0;for(let ch=0;ch<CH.length;ch++){const group=HOLD.filter(q=>q.ch===ch).sort((a,b)=>Number(!!db.seenMock[a.id])-Number(!!db.seenMock[b.id])||fnv(a.id+db.exams.length)-fnv(b.id+db.exams.length));selected.push(...group.slice(0,portions[ch]));}unseen=selected.filter(q=>!db.seenMock[q.id]).length;if(selected.length!==75){notice('模擬試験用の問題が不足しています。');return}session={type:'exam',pool:selected.map(q=>q.id),at:0,limit:75,answers:{},since:Date.now(),deadline:Date.now()+90*60*1000,unseen};if(timer)clearInterval(timer);timer=setInterval(()=>{if(!session||session.type!=='exam'){clearInterval(timer);timer=null;return}if(Date.now()>=session.deadline){finishExam(true);return}const t=$('#timeLabel');if(t)t.textContent=timeLeft()},1000);setScreen('quiz')}
function timeLeft(){if(!session||session.type!=='exam')return '';const s=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function current(){return QB[session.pool[session.at]]}
function quiz(){if(!session||!session.pool.length)return `<div class="card empty"><h2>問題がありません</h2><button class="btn btnSecondary" data-action="goHome">ホームへ</button></div>`;const q=current(),test=session.type==='exam',selected=session.answers[q.id],answered=Object.hasOwn(session.answers,q.id),isRight=answered&&selected===q.correct;const progress=test?Math.round((session.at+1)/session.pool.length*100):session.limit?Math.min(100,Math.round((session.at+1)/Math.min(session.limit,session.pool.length)*100)):Math.round((session.at+1)/session.pool.length*100);const typeLabel=test?'模擬試験':session.type==='review'?'復習':'通常演習';return `<div class="quizWrap"><div class="quizTop"><div><span class="eyebrow">${typeLabel}</span><div class="status">${test?`${session.at+1} / 75問`:`${session.at+1}問目 ${session.limit?'/ '+Math.min(session.pool.length,session.limit)+'問':''}`} ${test?'　残り時間 <strong id="timeLabel">'+timeLeft()+'</strong>':''}</div></div><button class="btn btnGhost btnSm" data-action="endQuiz">演習を終了 ×</button></div><div class="bar quizBar"><span style="width:${progress}%"></span></div><div class="card quizPaper"><div class="questionMeta"><span class="pill">第${q.ch+1}章 ${esc(CH[q.ch])}</span><span class="pill">${esc(['','基礎','標準','応用'][q.diff])}</span><span class="pill">${esc(q.topic)}</span></div><div class="questionText" id="questionHeading">${esc(q.stem)}</div><div class="options" role="group" aria-labelledby="questionHeading">${q.opts.map((o,i)=>{const c=test?(selected===i?'chosen':''):answered?(i===q.correct?'correct':selected===i?'incorrect':''):'';return `<button class="option ${c}" type="button" data-action="selectAnswer" data-index="${i}" ${!test&&answered?'disabled':''} ${test&&answered&&selected===i?'aria-pressed="true"':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${!test&&answered?`<div class="feedback ${isRight?'':'bad'}" role="status"><div class="feedbackTitle ${isRight?'good':'bad'}">${isRight?'✓ 正解です！':'✕ 不正解'}</div>${isRight?'':`<p><strong>正解：${esc(q.opts[q.correct])}</strong></p>`}<h3>ここを覚えよう</h3><p>${esc(q.why)}</p><p class="small muted">参照：${esc(q.sourceLocator||'一次資料')}（AIによる照合・専門家未監修）</p><details class="accord"><summary>ほかの選択肢との比較・根拠資料</summary><p>${esc(q.optionNote||'正解の判断基準を根拠資料と比較してください。')}</p><p class="source">参考根拠（AIが関連箇所を対応付け／全件の厳密な照合は未実施）：<a href="${esc(SOURCES[q.source]?.[1]||SOURCES.law[1])}" target="_blank" rel="noopener">${esc(SOURCES[q.source]?.[0]||'一次資料')}</a> / ${esc(q.sourceLocator||'該当箇所')}</p></details></div>`:''}<div class="quizActions">${test&&session.at>0?'<button class="btn btnSecondary btnSm" data-action="prev">← 前へ</button>':'<span class="quizHint">'+(test?'回答内容は採点前なら変更できます。':answered?'解説を確認して次へ進みましょう。':'選択肢を押すとすぐに採点します。')+'</span>'}${test?`<button class="btn btnPrimary" data-action="${session.at>=74?'finishExam':'next'}">${session.at>=74?'試験を採点する':'次の問題 →'}</button>`:answered?`<button class="btn btnPrimary" data-action="next">${session.limit&&session.at>=session.limit-1?'演習を終える':'次の問題 →'}</button>`:''}</div></div>${test?`<div class="panelNote">回答済み ${Object.keys(session.answers).length}/75問。全問終了するとまとめて採点します。${session.unseen<75?` 今回の未出題問題は開始時点で${session.unseen}問です。`:''}</div>`:''}</div>`}
function selectAnswer(index){if(!session)return;const q=current();if(session.type!=='exam'&&Object.hasOwn(session.answers,q.id))return;session.answers[q.id]=index;if(session.type!=='exam')mark(q,index,session.type);render()}
function next(){if(!session)return;if(session.type==='exam'){if(session.at<74)session.at++;else finishExam(false);render();return}if(!Object.hasOwn(session.answers,current().id)){notice('選択肢を選んでから進んでください。');return}session.at++;if(session.limit&&session.at>=session.limit){notice(`${session.limit}問の演習が終了しました。`);session=null;setScreen('home');return}if(session.at>=session.pool.length){if(session.type==='learn'&&!cfg.newonly){session.pool=orderForLearn(NORMAL.filter(q=>(cfg.ch==='all'||q.ch===+cfg.ch)&&(cfg.difficulty==='auto'||q.diff===+cfg.difficulty))).map(q=>q.id);session.at=0;session.answers={};session.cycles++;notice('全問一巡しました。再度、定着を確認します。')}else{session=null;setScreen('home');notice('対象問題をすべて解き終えました！');return}}render()}
function endQuiz(){if(!session)return;if(session.type==='exam'){if(!window.confirm('模擬試験を終了しますか？ 未採点の回答は保存されません。'))return;clearInterval(timer);timer=null}session=null;setScreen('home')}
function finishExam(expired){if(!session||session.type!=='exam')return;const s=session;if(timer)clearInterval(timer);timer=null;let right=0;let byCh=CH.map(()=>({right:0,total:0}));const review=[];for(const id of s.pool){const q=QB[id],ans=Object.hasOwn(s.answers,id)?s.answers[id]:null;const ok=ans===q.correct;mark(q,ans,'exam');if(ok)right++;byCh[q.ch].total++;if(ok)byCh[q.ch].right++;if(!ok)review.push({id,correct:q.opts[q.correct],chosen:ans==null?'未回答':q.opts[ans]})}
const record={at:new Date().toISOString(),right,total:75,unseen:s.unseen,expired:!!expired,byCh};db.exams.unshift(record);db.exams=db.exams.slice(0,30);save();result={...record,review};session=null;screen='result';render();window.scrollTo(0,0);notice(expired?'制限時間に達したため採点しました。':'模擬試験を採点しました。')}
function examResult(){if(!result)return home();const pct=Math.round(result.right/75*100),passed=pct>=70;return `<div class="pageTitle"><div class="eyebrow">RESULT</div><h1>模擬試験の結果</h1><p class="muted small">${esc(new Date(result.at).toLocaleString('ja-JP'))}の結果</p></div><div class="card resultHead"><span class="pill">${passed?'サイト内の70%目安を達成':'もう少し練習'}</span><div class="resultScore">${pct}<small>% 正答</small></div><h2 style="margin-top:8px">${result.right} / 75問 正解</h2><p class="small muted">※70％はサイト独自の正答率の目安です。試験範囲の網羅・本試験の難易度は未保証です。</p><p class="small muted">今回の模試開始時点で未出題だった問題：${result.unseen} / 75問</p><div class="buttonrow" style="justify-content:center"><button class="btn btnPrimary" data-action="goReview">間違えた問題を復習</button><button class="btn btnSecondary" data-action="goHome">ホームに戻る</button></div></div><div class="resultGrid">${result.byCh.map((s,i)=>`<div class="card resultItem"><strong>${s.right} / ${s.total}</strong><span>第${i+1}章 ${esc(CH[i])}</span></div>`).join('')}</div><div class="card resultList"><h3>今回の不正解・未回答（${result.review.length}問）</h3>${result.review.length?result.review.map(x=>{const q=QB[x.id];return `<div class="resultRow"><span class="resultNo">${esc(q.id)}</span><span class="resultText">${esc(q.stem)}<div class="small muted">あなたの回答：${esc(x.chosen)}</div><div class="right">正解：${esc(x.correct)}</div><div class="small">${esc(q.why)}</div></span></div>`}).join(''):'<p class="right">全問正解です！</p>'}</div>`}
function render(){navActive();app.innerHTML=screen==='home'?home():screen==='review'?review():screen==='settings'?settings():screen==='intro'?examIntro():screen==='quiz'?quiz():examResult();if(screen==='settings'){const s=$('#selectDifficulty'),l=$('#selectLimit'),c=$('#selectChapter'),n=$('#newOnly');if(s)s.value=cfg.difficulty;if(l)l.value=cfg.limit;if(c)c.value=cfg.ch;if(n)n.checked=cfg.newonly}document.title=(screen==='quiz'?'演習中 | ':'')+'食品表示検定 初級 | 演習室'}
function exportData(){const payload={app:'foodlabel-beginner',schema:2,signature:META.signature,exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='食品表示検定初級_学習履歴_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);notice('学習履歴を書き出しました。')}
async function importData(file){if(!file)return;try{if(file.size>6*1024*1024)throw Error('ファイルが大きすぎます。');const v=JSON.parse(await file.text());if(v.app!=='foodlabel-beginner'||v.schema!==2||v.signature!==META.signature||!v.data?.records||!Array.isArray(v.data.exams)||!v.data.seenMock)throw Error('この問題データと互換性のある学習履歴ではありません。');for(const [id,r] of Object.entries(v.data.records)){if(!QB[id]||typeof r.tries!=='number'||r.tries<0||!Number.isFinite(r.tries)||typeof r.right!=='number'||typeof r.wrong!=='number'||r.right+r.wrong!==r.tries)throw Error('記録に不正な内容があります。')}if(!window.confirm('現在の学習履歴を読み込んだ履歴で置き換えますか？'))return;db={records:v.data.records,exams:v.data.exams.slice(0,30),seenMock:v.data.seenMock,modifiedAt:new Date().toISOString()};save();render();notice('学習履歴を読み込みました。')}catch(e){notice('読み込み失敗：'+e.message)}finally{const x=$('#importFile');if(x)x.value=''}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='selectAnswer'){selectAnswer(+el.dataset.index);return}if(action==='goHome'){if(screen==='quiz'){endQuiz();return}setScreen('home');return}if(action==='goReview'){if(screen==='quiz'){endQuiz();return}setScreen('review');return}if(action==='goSettings'){if(screen==='quiz'){endQuiz();return}setScreen('settings');return}if(action==='goExam'){setScreen('intro');return}if(action==='startExam'){startExam();return}if(action==='startLearn'){startLearn();return}if(action==='startReview'){startReview(el.dataset.review);return}if(action==='endQuiz'){endQuiz();return}if(action==='next'){next();return}if(action==='prev'){if(session?.type==='exam'&&session.at>0){session.at--;render()}return}if(action==='finishExam'){if(session?.type==='exam'&&Object.keys(session.answers).length<75&&!window.confirm('未回答の問題があります。採点してよいですか？'))return;finishExam(false);return}if(action==='export'){exportData();return}if(action==='import'){$('#importFile')?.click();return}if(action==='resetConfig'){cfg={ch:'all',difficulty:'auto',limit:'0',newonly:false};render();notice('おすすめ設定に戻しました。');return}if(action==='clearData'){if(window.confirm('保存された学習履歴をすべて削除しますか？ この操作は元に戻せません。')){db={records:{},exams:[],seenMock:{},modifiedAt:null};save();render();notice('履歴を初期化しました。')}return}});
document.addEventListener('change',e=>{const f=e.target.dataset?.filter;if(f){cfg[f]=f==='newonly'?!!e.target.checked:e.target.value}if(e.target.id==='importFile')importData(e.target.files[0])});
load();render();
window.__foodLabelTest={bankCount:Q.length,holdCount:HOLD.length,normalCount:NORMAL.length,chapterCount:CH.length,signature:META.signature,debug:()=>({screen,records:Object.keys(db.records).length,session:session&&{type:session.type,at:session.at,length:session.pool.length},exams:db.exams.length})};
})();
</script>
